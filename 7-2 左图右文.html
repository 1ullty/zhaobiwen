<!DOCTYPE html>
<!-- 姓名：赵壁文，学号：24001010109，日期：2026-10-29 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-2 左图右文（仿网易新闻 要闻列表）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f4f5f7;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            color: #333;
        }
        .zbw_wrap {
            width: 900px;
            margin: 30px auto;
            background: #fff;
            padding: 20px 24px;
        }

        /* 栏目标题 */
        .zbw_hd {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 42px;
            border-bottom: 1px solid #e6e6e6;
            margin-bottom: 6px;
        }
        .zbw_hd .zbw_tt {
            display: flex; align-items: center;
            font-size: 20px; font-weight: 700; line-height: 42px;
        }
        .zbw_hd .zbw_tt::before {
            content: ""; width: 4px; height: 18px; margin-right: 8px;
            background: #e60012;   /* 网易红 */
        }
        .zbw_hd a { font-size: 13px; color: #888; text-decoration: none; padding-bottom: 8px; }

        /* ===== 左图右文：要闻列表（仿网易） ===== */
        .zbw_item {
            display: flex;            /* 左图 + 右文 */
            padding: 16px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .zbw_item:last-child { border-bottom: none; }

        /* 左缩略图 */
        .zbw_item img {
            width: 160px;
            height: 110px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
            flex-shrink: 0;
        }

        /* 右侧文字 */
        .zbw_text {
            flex: 1;
            margin-left: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .zbw_text h3 {
            font-size: 17px;
            font-weight: 700;
            color: #222;
            line-height: 24px;
        }
        .zbw_text h3 a { color: #222; text-decoration: none; }
        .zbw_text h3 a:hover { color: #e60012; }

        .zbw_text p {
            font-size: 13px;
            color: #999;
            line-height: 20px;
            margin-top: 6px;
        }

        /* 来源 + 评论数 */
        .zbw_meta {
            font-size: 12px;
            color: #bbb;
        }
        .zbw_meta .zbw_src { color: #999; }
    </style>
</head>
<body>
    <div class="zbw_wrap">

        <div class="zbw_hd">
            <span class="zbw_tt">新闻要闻</span>
            <a href="#">更多 &gt;</a>
        </div>

        <!-- 左图右文列表 -->
        <div class="zbw_list">
            <div class="zbw_item">
                <img src="./img/4.jpg" alt="深海网箱养殖">
                <div class="zbw_text">
                    <h3><a href="#">深远海养殖牧场建设提速，“蓝色粮仓”拓宽渔民增收路</a></h3>
                    <p>连片深水网箱在夕阳下蔚为壮观，现代化养殖装备推动传统渔业向深远海、装备化转型。</p>
                    <div class="zbw_meta">
                        <span class="zbw_src">赵壁文 · 大连</span>　　评论 326
                    </div>
                </div>
            </div>

            <div class="zbw_item">
                <img src="./img/5.jpg" alt="农光互补光伏">
                <div class="zbw_text">
                    <h3><a href="#">农光互补模式推广：板上发电、板下种植，一地两用</a></h3>
                    <p>光伏大棚下仍可正常耕作，清洁能源与高效农业叠加，为乡村振兴注入绿色动能。</p>
                    <div class="zbw_meta">
                        <span class="zbw_src">赵壁文 · 北京</span>　　评论 158
                    </div>
                </div>
            </div>

            <div class="zbw_item">
                <img src="./img/6.jpg" alt="库区峡谷大桥">
                <div class="zbw_text">
                    <h3><a href="#">西北库区峡谷公路桥建成通车，天堑变通途</a></h3>
                    <p>大桥横跨峡谷库区公路，两岸群众出行时间大幅缩短，沿线文旅资源加速盘活。</p>
                    <div class="zbw_meta">
                        <span class="zbw_src">赵壁文 · 兰州</span>　　评论 89
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
