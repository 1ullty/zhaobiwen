<!DOCTYPE html>

<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-1 上图下文（仿哔哩哔哩 视频卡片）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f4f5f7;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            color: #18191c;
        }
        .zbw_wrap {
            width: 900px;
            margin: 30px auto;
            background: #fff;
            padding: 20px 24px;
        }

        /* 栏目标题（一左一右） */
        .zbw_hd {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 42px;
            border-bottom: 1px solid #e6e6e6;
            margin-bottom: 16px;
        }
        .zbw_hd .zbw_tt {
            display: flex; align-items: center;
            font-size: 20px; font-weight: 700; line-height: 42px;
        }
        .zbw_hd .zbw_tt::before {
            content: ""; width: 4px; height: 18px; margin-right: 8px;
            background: #fb7299;   /* B站粉 */
        }
        .zbw_hd a { font-size: 13px; color: #888; text-decoration: none; padding-bottom: 8px; }

        /* ===== 上图下文：一排视频卡片（仿B站） ===== */
        .zbw_videos {
            display: flex;          /* 横向排列 */
            gap: 14px;
        }
        .zbw_card {
            flex: 1 1 0;            /* 三等分 */
            cursor: pointer;
        }
        /* 封面：16:9，圆角，右下角时长 */
        .zbw_cover {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
        }
        .zbw_cover img {
            width: 100%;
            aspect-ratio: 16 / 9;   /* 封面比例 */
            object-fit: cover;
            display: block;
        }
        .zbw_dur {
            position: absolute;
            right: 6px;
            bottom: 6px;
            font-size: 12px;
            color: #fff;
            background: rgba(0,0,0,.6);
            padding: 1px 6px;
            border-radius: 3px;
        }
        /* 标题：最多两行省略 */
        .zbw_title {
            font-size: 14px;
            line-height: 20px;
            margin-top: 8px;
            height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        /* UP主 + 播放量 */
        .zbw_meta {
            font-size: 12px;
            color: #9499a0;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="zbw_wrap">

        <div class="zbw_hd">
            <span class="zbw_tt">推荐视频</span>
            <a href="#">更多 &gt;</a>
        </div>

        <!-- 上图下文：视频卡片 -->
        <div class="zbw_videos">
            <div class="zbw_card">
                <div class="zbw_cover">
                    <img src="./img/4.jpg" alt="深海网箱养殖">
                    <span class="zbw_dur">12:35</span>
                </div>
                <p class="zbw_title">航拍深海网箱养殖牧场，原来“蓝色粮仓”是这样运作的</p>
                <p class="zbw_meta">赵壁文的纪录 · 12.5万播放</p>
            </div>

            <div class="zbw_card">
                <div class="zbw_cover">
                    <img src="./img/5.jpg" alt="农光互补光伏">
                    <span class="zbw_dur">08:20</span>
                </div>
                <p class="zbw_title">农光互补大棚实地探访：板上发电、板下种植，一地两用</p>
                <p class="zbw_meta">三农观察 · 8.3万播放</p>
            </div>

            <div class="zbw_card">
                <div class="zbw_cover">
                    <img src="./img/6.jpg" alt="库区峡谷大桥">
                    <span class="zbw_dur">15:42</span>
                </div>
                <p class="zbw_title">航拍西北库区峡谷大桥，天堑变通途</p>
                <p class="zbw_meta">地理中国 · 23.1万播放</p>
            </div>
        </div>

    </div>
</body>
</html>
