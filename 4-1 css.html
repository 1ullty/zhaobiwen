<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>109 赵壁文</title>
    <style>
       h2,h3,p{
           padding:0;
           margin:0;
       }/*群组选择器*/
       #box h3{
           padding:8px;
           margin:20px;
           border:1px solid #ccc;
           font-size:12px;
       }
       #box h3{
        /*字体大小16px*/
        font-size:16px;
        /* 行高33px */
        line-height:33px;
        /* 居中 */
        text-align: center;
        /* 颜色 #034 */
        color:#034;
        /*字间距3px*/
        letter-spacing: 3px;           
       }
       #box p{
           /* 颜色#666 */
           color:#666;
           /*首行空两格*/
           text-indent:2em;
           /* 行高150% */
           line-height:150%;
       }
       #box a{
           /* 颜色#034 */
           color:#034;
           /* 下划线 */
           text-decoration:underline;
       }
        /* 要求2：h2黑底白字，新增居中、行高150% */
       h2{
            background-color: black;
            color: white;
            text-align: center;
            line-height: 150%;
       }
        /*要求1：单个类选择器，学号姓名班级蓝色加粗*/
       .info{
            color: blue;
            font-weight: bold;
       }
        /*要求3：知识点 蓝底白字*/
       .knowledge{
            background-color: blue;
            color: white;
       }
    </style>
</head>
<body>
    <h2>css群组选择器和后代选择器</h2>  
    <div id="box">
        <h3>CSS进阶</h3>
        <p> 学号：<span class="info">109</span>，姓名：<span class="info">赵壁文</span>，班级：<span class="info">计算机24001班</span>，《高级网页设计》设计的学习难度；中等，
            本示例的知识点：<span class="knowledge">CSS 群组选择器和后代选择器</span>。
            <a href="#">【更多】</a>
        </p>
    </div>
</body>
</html>
