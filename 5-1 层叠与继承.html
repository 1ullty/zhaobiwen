<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>109 赵壁文</title>
      <link rel="stylesheet" href="css.css">
    <style>
        .text{
            color: violet !important;
            /* hack,优先级大于内嵌css */
        }
        #box{
            color:silver;
        }
        #text{
            color:yellow;
        }
        .text{
            color:blue;
        }
        p{
            color:red;
            font-size:60px;
        }
        /*id > class > tag*/
        /* body #box #text .text */
    </style>
    
</head>
<body>
    <h2>层叠与继承</h2>
    <div id="box" class="box">
        <p id="text" class="text">109 赵壁文</p>
        <p>CSS选择器的优先级</p>
    </div>
</body>
