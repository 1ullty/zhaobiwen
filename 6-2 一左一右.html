<!DOCTYPE html>

<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6-2 一左一右（仿新浪体育 栏目标题）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f4f5f7;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            color: #333;
        }
        .zbw_wrap {
            width: 900px;
            margin: 30px auto;
            background: #fff;
            padding: 20px 24px;
        }

        /* ===== 一左一右：栏目标题（仿新浪体育） ===== */
        /* 左侧加粗栏目名 + 红色小竖条，右侧“更多 >”，底部一条细灰线 */
        .zbw_hd {
            display: flex;
            justify-content: space-between;   /* 左右两端对齐 */
            align-items: flex-end;
            height: 42px;
            border-bottom: 1px solid #e6e6e6;
        }
        .zbw_hd .zbw_tt {
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: 700;
            color: #222;
            line-height: 42px;
        }
        .zbw_hd .zbw_tt::before {
            content: "";
            width: 4px;
            height: 18px;
            margin-right: 8px;
            background: #e60012;          /* 新浪红 */
        }
        .zbw_hd a {
            font-size: 13px;
            color: #888;
            text-decoration: none;
            padding-bottom: 8px;
        }
        .zbw_hd a:hover { color: #e60012; }

        /* 栏目下方的新闻链接列表 */
        .zbw_bd ul { list-style: none; padding: 6px 0; }
        .zbw_bd li {
            font-size: 14px;
            line-height: 32px;
            color: #333;
        }
        .zbw_bd li::before {
            content: "▪";
            color: #e60012;
            margin-right: 8px;
            font-size: 10px;
        }
        .zbw_bd li a { color: #333; text-decoration: none; }
        .zbw_bd li a:hover { color: #e60012; }
    </style>
</head>
<body>
    <div class="zbw_wrap">

        <!-- 栏目：足球（仿新浪体育） -->
        <div class="zbw_hd">
            <span class="zbw_tt">足球</span>
            <a href="#">更多 &gt;</a>
        </div>
        <div class="zbw_bd">
            <ul>
                <li><a href="#">中超联赛第28轮战报：主场逆转取胜</a></li>
                <li><a href="#">国足世预赛大名单公布，多位新人入选</a></li>
                <li><a href="#">欧洲五大联赛本轮焦点场次前瞻</a></li>
            </ul>
        </div>

    </div>
</body>
</html>
