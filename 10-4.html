<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10-4 Media Query 布局</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      background: #f2f4f7;
      color: #202b3c;
      font-family: "Microsoft YaHei", sans-serif;
    }

    .page {
      width: min(100%, 1120px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #687589;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .box {
      min-height: 140px;
      display: grid;
      place-items: center;
      border: 1px solid #e0e6ef;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 6px 18px rgb(32 43 60 / 7%);
      color: #315c9b;
      font-size: 24px;
      font-weight: 700;
    }

    @media (min-width: 480px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>赵壁文</h1>
    <p class="subtitle">视口变化 · Media Query 响应式布局</p>
    <section class="grid" aria-label="八个响应式盒子">
      <div class="box">盒子 1</div>
      <div class="box">盒子 2</div>
      <div class="box">盒子 3</div>
      <div class="box">盒子 4</div>
      <div class="box">盒子 5</div>
      <div class="box">盒子 6</div>
      <div class="box">盒子 7</div>
      <div class="box">盒子 8</div>
    </section>
  </main>
</body>
</html>
